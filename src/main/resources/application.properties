spring.application.name=customerApp

# Run server on port 8081 to avoid conflicts
server.port=8081

# Database configuration examples:
# For MySQL (use your real DB settings):
# spring.datasource.url=jdbc:mysql://localhost:3306/yourdb
# spring.datasource.username=root
# spring.datasource.password=secret
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For quick local testing we enable an H2 in-memory database.
spring.datasource.url=jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/customerApp
spring.datasource.username=xxxx
spring.datasource.password=xxxxxx

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect (optional for newer Hibernate versions)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
